name: Verify Approved Resume

on:
  push:
    branches: [ main ]
    paths:
      - 'resume/**'
      - '.github/workflows/generate-resume-pdf.yml'
      - 'scripts/generate_resume_pdf.js'
  pull_request:
    paths:
      - 'resume/**'
      - '.github/workflows/generate-resume-pdf.yml'
      - 'scripts/generate_resume_pdf.js'

permissions:
  contents: read

jobs:
  verify-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify reviewed PDF without regenerating it
        run: node scripts/generate_resume_pdf.js
